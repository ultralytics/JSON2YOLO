name: CI

on:
  schedule:
    - cron: "0 8 * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: ultralytics/actions/setup-uv@main
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv pip install -r requirements.txt pytest ultralytics

      - name: Compile Python files
        run: uv run python -m compileall -q .

      - name: Run tests
        run: uv run pytest -q
